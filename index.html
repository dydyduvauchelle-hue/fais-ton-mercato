function assignSlots(squad, formationKey) {
  const slots = FORMATIONS[formationKey];
  const pool = squad.filter((p) => !p.onLoan);
  const used = new Set();
  const assignment = {};
  slots.forEach((slot) => {
    const candidate = pool.find((p) => p.cat === slot.cat && !used.has(p.id));
    if (candidate) { assignment[candidate.id] = slot.id; used.add(candidate.id); }
  });
  const remaining = pool.filter((p) => !used.has(p.id));
  remaining.forEach((p, i) => { assignment[p.id] = i < BENCH_SIZE ? "BENCH" : "RESERVE"; });
  return assignment;
}
function shortName(name) { const parts = name.split(" "); return parts.length > 1 ? parts[parts.length - 1] : name; }
function fmtValue(v) { return v == null ? "n.c." : `${v}M€`; }

// Ni la valeur marchande ni le salaire ne sont fournis par l'API : estimations
// indicatives à partir de l'âge et du poste, jamais des données officielles.
function estimateValue(age, cat, num) {
  const base = { GK: 8, DEF: 12, MID: 15, FWD: 18 }[cat] || 10;
  let ageMult;
  if (age == null) ageMult = 0.8;
  else if (age <= 20) ageMult = 1.1;
  else if (age <= 23) ageMult = 1.3;
  else if (age <= 27) ageMult = 1.5;
  else if (age <= 30) ageMult = 1.1;
  else if (age <= 33) ageMult = 0.6;
  else ageMult = 0.3;
  const jitter = 0.85 + ((num || 0) % 10) * 0.03;
  return Math.max(1, Math.round(base * ageMult * jitter));
}
function estimateWage(value) {
  if (value == null) return null;
  return Math.max(0.3, Math.round(value * 0.18 * 10) / 10);
}

function ClubCrest({ club, size = 40, logoUrl }) {

      {club.star && <div className="ft-crest-star" style={{ fontSize: size * 0.16 }}>★</div>}

        background: `linear-gradient(165deg, ${club.c1} 0%, ${club.c1} 52%, ${club.c2} 52%, ${club.c2} 100%)`, fontSize: size * 0.24 }}>{club.code}</div>
    </div>
  );
}

        <span className="ft-jersey-collar" style={{ background: club.c1 }} />
      </>)}
      <span className="ft-jersey-num" style={empty ? {} : { color: club.c2 }}>{empty ? "+" : num}</span>
    </span>
  );
}

function FaisTonMercato() {
  const [selectedClub, setSelectedClub] = useState("om");
  const club = CLUBS.find((c) => c.id === selectedClub);
  const [view, setView] = useState("home");
  const [squad, setSquad] = useState(FALLBACK_SQUADS.om);
  const [marketPool, setMarketPool] = useState(MARKET_POOL);
  const [transferBudget, setTransferBudget] = useState(START_TRANSFER_BUDGET);
  const [dncgSold, setDncgSold] = useState(0);
  const [formation, setFormation] = useState("4-3-3");
  const [assignment, setAssignment] = useState(() => assignSlots(FALLBACK_SQUADS.om, "4-3-3"));
  const [selected, setSelected] = useState(null);
  const [flash, setFlash] = useState("");
  const [marketSearch, setMarketSearch] = useState("");
  const [customForm, setCustomForm] = useState({ name: "", cat: "MID", age: 24, value: 10, num: "", photo: null });
  const [searchQuery, setSearchQuery] = useState("");
  const [searchResults, setSearchResults] = useState([]);
  const [searching, setSearching] = useState(false);
  const [dataSource, setDataSource] = useState("loading");
  const [logosCache, setLogosCache] = useState({});
  const [liveError, setLiveError] = useState("");

  useEffect(() => {
    let cancelled = false;
    setDataSource("loading");
    setSquad(FALLBACK_SQUADS[selectedClub] || []);
    setTransferBudget(START_TRANSFER_BUDGET);
    setDncgSold(0);
    async function loadLive() {
      try {
        const r = await fetch(`/api/squad?team=${encodeURIComponent(club.apiQuery)}`);
        const data = await r.json();
        if (data.error) throw new Error(data.error);
        const team = data.team;
        const players = data.players || [];
        if (!team || players.length === 0) throw new Error("Réponse vide");
        const mapped = players.map((p) => {
          const cat = POS_MAP[p.position] || "MID";
          return { id: `live-${p.id}`, name: p.name, num: p.number || 0, cat, pos: p.position || "",
            age: p.age || null, value: estimateValue(p.age, cat, p.number), photo: p.photo || null,
            onLoan: false, loanOA: false, loanedIn: false };
        });
        if (!cancelled) {
          setSquad(mapped);
          setLogosCache((prev) => ({ ...prev, [selectedClub]: team.logo || null }));
          setDataSource("live");
        }
      } catch (err) {
        if (!cancelled) { setLiveError(err.message || "Erreur inconnue"); setDataSource("demo"); }
      }
    }
    loadLive();
    return () => { cancelled = true; };
  }, [selectedClub]);

  useEffect(() => { setAssignment(assignSlots(squad, formation)); setSelected(null); }, [formation, squad]);
  useEffect(() => { if (!flash) return; const t = setTimeout(() => setFlash(""), 2400); return () => clearTimeout(t); }, [flash]);

  const slots = FORMATIONS[formation];
  const handleSelect = (id) => {
    if (!selected) return setSelected(id);
    if (selected === id) return setSelected(null);
    setAssignment((prev) => ({ ...prev, [selected]: prev[id], [id]: prev[selected] }));
    setSelected(null);
  };

  const starters = useMemo(() => slots.map((slot) => ({ slot, player: squad.find((p) => assignment[p.id] === slot.id) || null })), [assignment, formation, squad]);
  const bench = useMemo(() => squad.filter((p) => assignment[p.id] === "BENCH").sort((a, b) => CAT_ORDER[a.cat] - CAT_ORDER[b.cat]), [assignment, squad]);
  const reserve = useMemo(() => squad.filter((p) => assignment[p.id] === "RESERVE").sort((a, b) => CAT_ORDER[a.cat] - CAT_ORDER[b.cat]), [assignment, squad]);
  const onLoanList = useMemo(() => squad.filter((p) => p.onLoan), [squad]);

  const score = useMemo(() => {
    const filled = starters.filter((s) => s.player);
    const matches = filled.filter((s) => s.player.cat === s.slot.cat).length;
    const coverage = (matches / slots.length) * 25;
    const squadForBudget = [...filled.map((s) => s.player), ...bench];
    const hasValues = squadForBudget.some((p) => p.value != null && p.value > 0);
    const used = squadForBudget.reduce((s, p) => s + (p.value || 0), 0);
    const wageBill = Math.round(squadForBudget.reduce((s, p) => s + (estimateWage(p.value) || 0), 0) * 10) / 10;
    const ratio = used / SQUAD_VALUE_CAP;
    const budgetScore = ratio <= 1 ? 10 + 15 * ratio : Math.max(0, 25 - (ratio - 1) * 100);
    const withAge = filled.filter((s) => s.player.age);
    const avgAge = withAge.reduce((s, x) => s + x.player.age, 0) / (withAge.length || 1);
    const ageScore = Math.max(0, Math.min(15, 15 - Math.max(0, Math.abs(avgAge - 25.5) - 2.5) * 3));
    const cats = ["GK", "DEF", "MID", "FWD"];
    const benchCatCount = cats.filter((c) => bench.some((p) => p.cat === c)).length;
    const coherence = ageScore + (benchCatCount / 4) * 10;
    const avgValue = filled.reduce((s, x) => s + (x.player.value || 0), 0) / (filled.length || 1);
    const quality = Math.min(25, (avgValue / 45) * 25);
    return { coverage, budgetScore, coherence, quality, hasValues, wageBill,
      total: coverage + coherence + (hasValues ? budgetScore + quality : 0), partial: !hasValues, used, avgAge: withAge.length ? avgAge : null };
  }, [starters, bench, slots.length]);

  const buyPlayer = (p) => {
    if (transferBudget < p.value) return;
    setTransferBudget((b) => Math.round((b - p.value) * 10) / 10);
    setSquad((s) => [...s, { ...p, onLoan: false, loanOA: false, loanedIn: false }]);
    setMarketPool((m) => m.filter((x) => x.id !== p.id));
    setFlash(`${p.name} rejoint l'effectif.`);
  };
  const sellPlayer = (p) => {
    const fee = p.value != null ? Math.round(p.value * 0.9 * 10) / 10 : 0;
    setTransferBudget((b) => Math.round((b + fee) * 10) / 10);
    if (selectedClub === "om") setDncgSold((d) => Math.round((d + fee) * 10) / 10);
    setSquad((s) => s.filter((x) => x.id !== p.id));
    setFlash(`${p.name} vendu${fee ? ` pour ${fee}M€` : ""}.`);
  };
  const loanOutPlayer = (p, withOA) => {
    setSquad((s) => s.map((x) => (x.id === p.id ? { ...x, onLoan: true, loanOA: withOA } : x)));
    setFlash(`${p.name} prêté ${withOA ? "avec option d'achat" : "sans option d'achat"}.`);
  };
  const recallPlayer = (p) => {
    setSquad((s) => s.map((x) => (x.id === p.id ? { ...x, onLoan: false, loanOA: false } : x)));
    setFlash(`${p.name} rappelé de prêt.`);
  };
  const updateNumber = (id, num) => {
    const n = Math.max(1, Math.min(99, Number(num) || 1));
    setSquad((s) => s.map((x) => (x.id === id ? { ...x, num: n } : x)));
  };
  const addCustomPlayer = (mode) => {
    if (!customForm.name.trim()) return;
    const base = { id: `custom-${Date.now()}`, name: customForm.name.trim(), cat: customForm.cat, pos: CAT_LABEL[customForm.cat],
      age: Number(customForm.age) || 20, value: Number(customForm.value) || 1, photo: customForm.photo || null };
    if (mode === "achat") { setMarketPool((m) => [...m, base]); setFlash(`${base.name} ajouté aux pistes du marché.`); }
    else {
      const fee = Math.max(1, Math.round(base.value * 0.15 * 10) / 10);
      if (transferBudget < fee) { setFlash("Budget insuffisant pour ce prêt."); return; }
      setTransferBudget((b) => Math.round((b - fee) * 10) / 10);
      setSquad((s) => [...s, { ...base, num: Number(customForm.num) || 99, onLoan: false, loanOA: false, loanedIn: true }]);
      setFlash(`${base.name} arrive en prêt (indemnité ${fee}M€).`);
    }
    setCustomForm({ name: "", cat: "MID", age: 24, value: 10, num: "", photo: null });
    setSearchResults([]);
  };

  const searchPlayer = async () => {
    if (searchQuery.trim().length < 3) { setFlash("Tape au moins 3 lettres."); return; }
    setSearching(true);
    setSearchResults([]);
    try {
      const r = await fetch(`/api/search-player?q=${encodeURIComponent(searchQuery.trim())}`);
      const data = await r.json();
      if (data.error) throw new Error(data.error);
      setSearchResults(data.results || []);
      if (!data.results || data.results.length === 0) setFlash("Aucune correspondance trouvée dans l'API.");
    } catch (err) {
      setFlash(`Recherche échouée : ${err.message}`);
    } finally {
      setSearching(false);
    }
  };
  const pickSearchResult = (r) => {
    setCustomForm({
      name: r.name, cat: POS_MAP[r.position] || "MID", age: r.age || 20,
      value: estimateValue(r.age, POS_MAP[r.position] || "MID", r.number || 0),
      num: r.number || "", photo: r.photo || null,
    });
    setSearchResults([]);
    setFlash(`${r.name} — infos remplies automatiquement, vérifie et complète si besoin.`);
  };

  const Chip = ({ player, slot, size = "md" }) => {
    const isEmpty = !player, isSelected = player && selected === player.id;
    return (
      <button className={`ft-chip ft-chip-${size} ${isSelected ? "ft-chip-sel" : ""} ${isEmpty ? "ft-chip-empty" : ""}`}
        onClick={() => player && handleSelect(player.id)} disabled={isEmpty}>
        <Jersey club={club} num={player?.num} empty={isEmpty} />
        <span className="ft-chip-name">{player ? shortName(player.name) : CAT_LABEL[slot.cat]}</span>
        {player && size !== "sm" && <span className="ft-chip-tag">{player.cat} · {fmtValue(player.value)}</span>}
      </button>
    );
  };
  const Bar = ({ label, value, max = 25 }) => (
    <div className="ft-bar-row">
      <div className="ft-bar-label">{label}</div>
      <div className="ft-bar-track"><div className="ft-bar-fill" style={{ width: `${Math.max(0, Math.min(100, (value / max) * 100))}%` }} /></div>
      <div className="ft-bar-value">{Math.round(value)}/{max}</div>
    </div>
  );

  const filteredMarket = marketPool.filter((p) => p.name.toLowerCase().includes(marketSearch.toLowerCase()));
  const dncgDone = dncgSold >= DNCG_TARGET;

  return (
    <div className="ft-root">
      <nav className="ft-nav">
        <button className={`ft-nav-btn ${view === "home" ? "ft-active" : ""}`} onClick={() => setView("home")}><Icon>🏠</Icon> Accueil</button>
        <button className={`ft-nav-btn ${view === "squad" ? "ft-active" : ""}`} onClick={() => setView("squad")}><Icon>👕</Icon> Compositeur</button>
        <button className={`ft-nav-btn ${view === "market" ? "ft-active" : ""}`} onClick={() => setView("market")}><Icon>🔁</Icon> Marché</button>
      </nav>
      {flash && <div className="ft-flash">{flash}</div>}
      <div className="ft-body">
        {dataSource === "loading" && <div className="ft-status loading"><Icon>📶</Icon> Connexion à API-Football…</div>}
        {dataSource === "live" && <div className="ft-status live"><Icon>📶</Icon> Données en direct via API-Football</div>}
        {dataSource === "demo" && <div className="ft-status demo"><Icon>🚫</Icon> Appel échoué ({liveError}) — {FALLBACK_SQUADS[selectedClub] ? "mode démo hors-ligne." : "aucun repli disponible pour ce club, réessaie ou ajoute des joueurs toi-même."}</div>}

        {view === "home" && (<>
          <div className="ft-hero">
            <ClubCrest club={club} size={54} logoUrl={logosCache[selectedClub]} />
            <h1>Fais ton Mercato</h1>
            <p>Ligue 1 & Ligue 2 2026-2027 · choisis un club et prends les commandes de son effectif</p>
          </div>
          <div className="ft-grid">
            {CLUBS.map((c) => (
              <button key={c.id} className="ft-club-card" disabled={!c.active} onClick={() => { if (c.active) { setSelectedClub(c.id); setView("squad"); } }}>
                <ClubCrest club={c} size={40} logoUrl={logosCache[c.id]} />
                <span className="ft-club-name">{c.name}</span>
                <span className="ft-soon">{c.active ? c.league : "bientôt"}</span>
              </button>
            ))}
          </div>
        </>)}

        {view === "squad" && (<>
          <div className="ft-head">
            <ClubCrest club={club} size={44} logoUrl={logosCache[selectedClub]} />
            <div><div className="ft-club">{club.name}</div><div className="ft-coach">Entraîneur : {club.coach}</div></div>
            <div className="ft-formations">
              {Object.keys(FORMATIONS).map((f) => (
                <button key={f} className={`ft-fbtn ${f === formation ? "ft-fbtn-active" : ""}`} onClick={() => setFormation(f)}>{f}</button>
              ))}
            </div>
          </div>
          <div className="ft-budget">
            <Icon>💰</Icon>
            <div className="ft-budget-track"><div className={`ft-budget-fill ${score.used > SQUAD_VALUE_CAP ? "ft-over" : ""}`} style={{ width: `${Math.min(100, (score.used / SQUAD_VALUE_CAP) * 100)}%` }} /></div>
            <div className="ft-budget-label">{score.hasValues ? `${score.used}M€ / ${SQUAD_VALUE_CAP}M€` : "valeur non fournie par l'API"}</div>
          </div>
          <div className="ft-budget">
            <Icon>🧾</Icon>
            <div className="ft-budget-track"><div className={`ft-budget-fill ${score.wageBill > club.salaryCap ? "ft-over" : ""}`} style={{ width: `${Math.min(100, (score.wageBill / club.salaryCap) * 100)}%` }} /></div>
            <div className="ft-budget-label">{score.wageBill}M€/an · plafond {club.salaryCap}M€ (masse salariale estimée)</div>
          </div>

          <div className="ft-pitch">
            {starters.map(({ slot, player }) => (
              <div key={slot.id} style={{ position: "absolute", top: `${slot.top}%`, left: `${slot.left}%` }}><Chip player={player} slot={slot} /></div>
            ))}
          </div>
          <div className="ft-hint"><Icon>⇄</Icon> Cliquez un titulaire puis un joueur du banc ou de la réserve pour les échanger.</div>
          <div className="ft-section-label"><span>Banc</span><span>{bench.length}/{BENCH_SIZE}</span></div>
          <div className="ft-bench-row">{bench.map((p) => <Chip key={p.id} player={p} size="sm" />)}</div>
          <div className="ft-section-label"><span>Réserve</span><span>{reserve.length} · illimitée</span></div>
          <div className="ft-reserve">
            {reserve.map((p) => (
              <div key={p.id} className={`ft-res-pill ${selected === p.id ? "ft-chip-sel" : ""}`} onClick={() => handleSelect(p.id)}>
                <span className="ft-res-num">{p.num}</span>{shortName(p.name)}
              </div>
            ))}
          </div>
          <div className="ft-score">
            <div className="ft-score-head">
              <div className="ft-gauge" style={{ "--pct": Math.round(score.total) }}><div className="ft-gauge-inner"><div className="ft-gauge-num">{Math.round(score.total)}</div><div className="ft-gauge-sub">/100</div></div></div>
              <div><div className="ft-score-title">Note du mercato {score.partial && "(partielle)"}</div><div className="ft-score-desc">Âge moyen du onze : {score.avgAge ? score.avgAge.toFixed(1) : "n.c."} ans</div></div>
            </div>
            <Bar label="Couverture des postes" value={score.coverage} />
            {score.hasValues ? <Bar label="Discipline budgétaire" value={score.budgetScore} /> : <div className="ft-bar-row"><div className="ft-bar-label">Discipline budgétaire</div><div className="ft-bar-track"><div className="ft-bar-fill ft-na" /></div><div className="ft-bar-value">n.c.</div></div>}
            <Bar label="Cohérence d'effectif" value={score.coherence} />
            {score.hasValues ? <Bar label="Valeur du recrutement" value={score.quality} /> : <div className="ft-bar-row"><div className="ft-bar-label">Valeur du recrutement</div><div className="ft-bar-track"><div className="ft-bar-fill ft-na" /></div><div className="ft-bar-value">n.c.</div></div>}
          </div>
        </>)}

        {view === "market" && (<>
          {selectedClub === "om" && (
            <div className={`ft-dncg ${dncgDone ? "ft-dncg-done" : ""}`}>
              <Icon>{dncgDone ? "✅" : "⚠️"}</Icon>
              <div style={{ flex: 1 }}>
                {dncgDone ? "Objectif DNCG atteint — l'OM a cédé assez de joueurs, la pression financière retombe." : `Contrainte DNCG : céder ${DNCG_TARGET}M€ de joueurs. Progression : ${dncgSold}M€ / ${DNCG_TARGET}M€.`}
                <div className="ft-dncg-track"><div className="ft-dncg-fill" style={{ width: `${Math.min(100, (dncgSold / DNCG_TARGET) * 100)}%` }} /></div>
              </div>
            </div>
          )}

          <div className="ft-market-budget"><Icon>💰</Icon> Budget mercato disponible<b>{transferBudget}M€</b></div>

          <div className="ft-section-label"><span>Pistes du mercato (sélection manuelle)</span></div>
          <div className="ft-search"><Icon>🔍</Icon><input placeholder="Filtrer la liste…" value={marketSearch} onChange={(e) => setMarketSearch(e.target.value)} /></div>
          {filteredMarket.map((p) => (
            <div key={p.id} className="ft-row">
              <div className="ft-row-num">{p.cat}</div>
              <div><div className="ft-row-name">{p.name}</div><div className="ft-row-sub">{p.pos} · {p.age} ans</div></div>
              <div className="ft-row-actions"><button className="ft-mini-btn ft-buy" disabled={transferBudget < p.value} onClick={() => buyPlayer(p)}>Acheter · {fmtValue(p.value)}</button></div>
            </div>
          ))}

          <div className="ft-custom">
            <div className="ft-custom-title"><Icon>🔎</Icon> Chercher un vrai joueur (via API-Football)</div>
            <div className="ft-search" style={{ marginBottom: 8 }}>
              <input placeholder="Ex. Kilian Sildillia" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} onKeyDown={(e) => e.key === "Enter" && searchPlayer()} />
              <button className="ft-mini-btn ft-buy" onClick={searchPlayer} disabled={searching}>{searching ? "…" : "Chercher"}</button>
            </div>
            {searchResults.length > 0 && (
              <div className="ft-search-results">
                {searchResults.map((r) => (
                  <div key={r.id} className="ft-search-result" onClick={() => pickSearchResult(r)}>
                    {r.photo ? <img className="ft-row-photo" src={r.photo} alt="" /> : <div className="ft-row-num">{POS_MAP[r.position] || "?"}</div>}
                    <div><div className="ft-row-name">{r.name}</div><div className="ft-row-sub">{r.team || "club inconnu"} · {r.position || "poste inconnu"} · {r.age ? `${r.age} ans` : ""}</div></div>
                  </div>
                ))}
              </div>
            )}

            <div className="ft-custom-title" style={{ marginTop: 12 }}><Icon>➕</Icon> Ou remplis à la main</div>
            <div className="ft-custom-grid">
              <input placeholder="Nom du joueur" value={customForm.name} onChange={(e) => setCustomForm((f) => ({ ...f, name: e.target.value }))} />
              <select value={customForm.cat} onChange={(e) => setCustomForm((f) => ({ ...f, cat: e.target.value }))}>
                <option value="GK">Gardien</option><option value="DEF">Défenseur</option><option value="MID">Milieu</option><option value="FWD">Attaquant</option>
              </select>
              <input type="number" placeholder="Âge" value={customForm.age} onChange={(e) => setCustomForm((f) => ({ ...f, age: e.target.value }))} />
              <input type="number" placeholder="Valeur (M€)" value={customForm.value} onChange={(e) => setCustomForm((f) => ({ ...f, value: e.target.value }))} />
              <input type="number" placeholder="Numéro (optionnel)" value={customForm.num} onChange={(e) => setCustomForm((f) => ({ ...f, num: e.target.value }))} />
            </div>
            <div className="ft-custom-actions">
              <button className="ft-mini-btn ft-buy" onClick={() => addCustomPlayer("achat")}>Ajouter comme piste d'achat</button>
              <button className="ft-mini-btn" onClick={() => addCustomPlayer("pret")}>Faire venir en prêt</button>
            </div>
          </div>

          <div className="ft-section-label"><span>Votre effectif</span></div>
          {squad.filter((p) => !p.onLoan).map((p) => (
            <div key={p.id} className="ft-row">
              {p.photo && <img className="ft-row-photo" src={p.photo} alt="" />}
              <input className="ft-num-input" type="number" value={p.num} min={1} max={99} onChange={(e) => updateNumber(p.id, e.target.value)} />
              <div>
                <div className="ft-row-name">{p.name}{p.saleTag && <span className="ft-tag-sale">en instance de départ</span>}{p.loanedIn && <span className="ft-tag-loan">prêté au club</span>}</div>
                <div className="ft-row-sub">{p.pos} · {p.age ? `${p.age} ans` : "âge n.c."} · {fmtValue(p.value)}</div>
              </div>
              <div className="ft-row-actions">
                <button className="ft-mini-btn" onClick={() => loanOutPlayer(p, false)}>Prêter</button>
                <button className="ft-mini-btn" onClick={() => loanOutPlayer(p, true)}>Prêter +OA</button>
                <button className="ft-mini-btn ft-sell" onClick={() => sellPlayer(p)}>Vendre{p.value != null ? ` · ${Math.round(p.value * 0.9 * 10) / 10}M€` : ""}</button>
              </div>
            </div>
          ))}

          {onLoanList.length > 0 && (<>
            <div className="ft-section-label"><span>Joueurs prêtés</span></div>
            {onLoanList.map((p) => (
              <div key={p.id} className="ft-row">
                <div className="ft-row-num">{p.num}</div>
                <div><div className="ft-row-name">{p.name}{p.loanOA && <span className="ft-oa">OA</span>}</div><div className="ft-row-sub">{p.pos}</div></div>
                <div className="ft-row-actions"><button className="ft-mini-btn" onClick={() => recallPlayer(p)}><Icon size={11}>↩️</Icon> Rappeler</button></div>
              </div>
            ))}
          </>)}
        </>)}

        <div className="ft-footnote"><Icon>ℹ️</Icon> {dataSource === "live" ? "Effectif et logo en direct depuis API-Football. Valeurs et salaires estimés (âge/poste) — pas des données officielles." : "Repli sur des données saisies à la main."}</div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<FaisTonMercato />);
</script>
