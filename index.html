  if (!originClub) return false;
  const a = clubName.toLowerCase(), b = originClub.toLowerCase();
  return RIVAL_PAIRS.some(([x, y]) => (a.includes(x) && b.includes(y)) || (a.includes(y) && b.includes(x)));
}

function assignSlots(squad, formationKey, preferredNames, preferredBench) {
  const slots = FORMATIONS[formationKey];
  const pool = squad.filter((p) => !p.onLoan);
  const used = new Set();
  const assignment = {};
  if (preferredNames) {
    slots.forEach((slot) => {
      const wanted = preferredNames[slot.id];
      if (!wanted) return;
      const match = pool.find((p) => !used.has(p.id) && p.name.toLowerCase().includes(wanted.toLowerCase()));
      if (match) { assignment[match.id] = slot.id; used.add(match.id); }
    });
  }
  slots.forEach((slot) => {
    if (Object.values(assignment).includes(slot.id)) return;
    const candidate = pool.find((p) => p.cat === slot.cat && !used.has(p.id));
    if (candidate) { assignment[candidate.id] = slot.id; used.add(candidate.id); }
  });
  let benchCount = 0;
  if (preferredBench) {
    preferredBench.forEach((wanted) => {
      if (benchCount >= BENCH_SIZE) return;
      const match = pool.find((p) => !used.has(p.id) && p.name.toLowerCase().includes(wanted.toLowerCase()));
      if (match) { assignment[match.id] = "BENCH"; used.add(match.id); benchCount++; }
    });
  }
  const remaining = pool.filter((p) => !used.has(p.id));
  remaining.forEach((p) => {
    if (benchCount < BENCH_SIZE) { assignment[p.id] = "BENCH"; benchCount++; }
    else { assignment[p.id] = "RESERVE"; }
  });
  return assignment;
}
function shortName(name) { const parts = name.split(" "); return parts.length > 1 ? parts[parts.length - 1] : name; }
function fmtValue(v) {
  if (v == null) return "n.c.";
  if (v < 1) return `${Math.round(v * 1000)}K€`;
  return `${v}M€`;
}
function sellFee(value) { return value == null ? 0 : Math.round(value * 0.9 * 1000) / 1000; }
function calcOA(value, age) {
  if (value == null) return 0;
  const a = age || 25;
  const mult = a <= 21 ? 1.25 : a <= 24 ? 1.15 : a <= 28 ? 1.05 : 1;
  return Math.round(value * mult * 1000) / 1000;
}

function subPosFromLabel(label) {
  const l = (label || "").toLowerCase();
  if (l.includes("gardien")) return "G";
  if (l.includes("arrière droit") || l.includes("arriere droit")) return "DD";
  if (l.includes("arrière gauche") || l.includes("arriere gauche")) return "DG";
  if (l.includes("défenseur central") || l.includes("defenseur central")) return "DC";
  if (l.includes("milieu défensif") || l.includes("milieu defensif")) return "MDC";
  if (l.includes("milieu offensif")) return "MOC";
  if (l.includes("milieu central")) return "MC";
  if (l.includes("ailier droit")) return "AD";
  if (l.includes("ailier gauche")) return "AG";
  if (l.includes("ailier")) return "AI";
  if (l.includes("avant-centre") || l.includes("attaquant")) return "BU";
  return "";
}
function getSubPos(p) { return p.subPos || subPosFromLabel(p.pos) || ""; }
function posLine(p) { const sp = getSubPos(p); return sp ? `${CAT_LABEL[p.cat] || p.cat} · ${sp}` : (CAT_LABEL[p.cat] || p.cat); }

function estimateValue(age, cat, num) {
  const base = { GK: 8, DEF: 12, MID: 15, FWD: 18 }[cat] || 10;
  let ageMult;
  if (age == null) ageMult = 0.8;
  else if (age <= 20) ageMult = 1.1;
  else if (age <= 23) ageMult = 1.3;
  else if (age <= 27) ageMult = 1.5;
  else if (age <= 30) ageMult = 1.1;
  else if (age <= 33) ageMult = 0.6;
  else ageMult = 0.3;
  const jitter = 0.85 + ((num || 0) % 10) * 0.03;
  return Math.max(1, Math.round(base * ageMult * jitter));
}
function estimateWage(value) {
  if (value == null) return null;
  return Math.max(0.3, Math.round(value * 0.18 * 10) / 10);
}
function monthlySalaryK(p) {
  if (p.salaryMonthly != null) return Math.round(p.salaryMonthly);
  const annual = estimateWage(p.value);
  return annual == null ? null : Math.round((annual * 1000) / 12);
}

function lighten(hex) {
  try {
    const n = parseInt(hex.slice(1), 16);
    const r = Math.min(255, ((n >> 16) & 255) + 60), g = Math.min(255, ((n >> 8) & 255) + 60), b = Math.min(255, (n & 255) + 60);
    return `rgb(${r},${g},${b})`;
  } catch (e) { return hex; }
}
function Skeleton({ count = 6 }) {
  return (
    <div className="ft-grid">
      {Array.from({ length: count }).map((_, i) => <div key={i} className="ft-skeleton" />)}
    </div>
  );
}

function makeFixtures(club) {
  const others = RIVALS.filter((r) => !(club.matchNames || []).some((n) => r.name.toLowerCase().includes(n)) && !r.name.toLowerCase().includes(club.name.toLowerCase())).slice(0, 10);
  return others.map((r, i) => ({ id: i, opponent: r.name, oppRating: r.rating, home: i % 2 === 0, played: false, result: null }));
}
function makeTable(club) {
  const others = RIVALS.filter((r) => !(club.matchNames || []).some((n) => r.name.toLowerCase().includes(n)) && !r.name.toLowerCase().includes(club.name.toLowerCase())).slice(0, 10);
  return [{ name: club.name, pts: 0, gf: 0, ga: 0, played: 0, self: true }, ...others.map((r) => ({ name: r.name, pts: 0, gf: 0, ga: 0, played: 0 }))];
}

  // Glisser-déposer tactile : l'API native HTML5 ne fonctionne pas sur mobile,
  // on gère donc nous-mêmes appui-maintien + déplacement du doigt, avec un
  // maillot "fantôme" qui suit le doigt pour un vrai retour visuel.
  const touchDragRef = React.useRef({ id: null, player: null, moved: false, startX: 0, startY: 0 });
  const [touchDragId, setTouchDragId] = useState(null);
  const [touchGhost, setTouchGhost] = useState(null);
  const onChipTouchStart = (player, isBench) => (e) => {
    const t = e.touches[0];
    touchDragRef.current = { id: player.id, player, isBench: !!isBench, moved: false, startX: t.clientX, startY: t.clientY };
  };
  const onChipTouchMove = (e) => {
    const drag = touchDragRef.current;
    if (!drag.id) return;
    const t = e.touches[0];
    const dx = t.clientX - drag.startX, dy = t.clientY - drag.startY;
    if (!drag.moved) {
      const dist = Math.max(Math.abs(dx), Math.abs(dy));
      if (dist > 12) {
        if (drag.isBench && Math.abs(dx) > Math.abs(dy) * 1.4) {
          // Sur le banc uniquement, et seulement si le geste est clairement horizontal :
          // on laisse faire le défilement natif plutôt que de démarrer un glisser-déposer.
          touchDragRef.current = { id: null, player: null, isBench: false, moved: false, startX: 0, startY: 0 };
          return;
        }
        drag.moved = true;
        setTouchDragId(drag.id);
      }
    }
    if (drag.moved) {
      e.preventDefault();
      setTouchGhost({ x: t.clientX, y: t.clientY, player: drag.player });
    }
  };
  const onChipTouchEnd = (e) => {
    const drag = touchDragRef.current;
    if (!drag.id) return;
    if (drag.moved) {
      e.preventDefault();
      const t = e.changedTouches[0];
      const el = document.elementFromPoint(t.clientX, t.clientY);
      const target = el && el.closest("[data-player-id],[data-slot-id]");
      if (target) {
        const tp = target.getAttribute("data-player-id");
        const ts = target.getAttribute("data-slot-id");
        if (tp && tp !== drag.id) swapPlayers(drag.id, tp);
        else if (ts) setAssignment((prev) => ({ ...prev, [drag.id]: ts }));
      }
    }
    touchDragRef.current = { id: null, player: null, isBench: false, moved: false, startX: 0, startY: 0 };
    setTouchDragId(null);
    setTouchGhost(null);
  };

  const [prevAssignment, setPrevAssignment] = useState(null);

  const swapPlayers = (idA, idB) => {

  const starters = useMemo(() => slots.map((slot) => ({ slot, player: squad.find((p) => assignment[p.id] === slot.id) || null })), [assignment, formation, squad]);
  const bench = useMemo(() => squad.filter((p) => assignment[p.id] === "BENCH").sort((a, b) => CAT_ORDER[a.cat] - CAT_ORDER[b.cat]), [assignment, squad]);
  const reserve = useMemo(() => squad.filter((p) => assignment[p.id] === "RESERVE").sort((a, b) => CAT_ORDER[a.cat] - CAT_ORDER[b.cat]), [assignment, squad]);
  const onLoanList = useMemo(() => squad.filter((p) => p.onLoan), [squad]);

  const score = useMemo(() => {
    if (!club) return { coverage: 0, budgetScore: 0, coherence: 0, quality: 0, hasValues: false, wageBill: 0, total: 0, partial: true, used: 0, avgAge: null };
    const filled = starters.filter((s) => s.player);
    const matches = filled.filter((s) => s.player.cat === s.slot.cat).length;
    const coverage = (matches / slots.length) * 25;
    const squadForBudget = [...filled.map((s) => s.player), ...bench];
    const hasValues = squadForBudget.some((p) => p.value != null && p.value > 0);
    const used = squadForBudget.reduce((s, p) => s + (p.value || 0), 0);
    const fullSquad = squad.filter((p) => !p.onLoan);
    const wageBill = Math.round(fullSquad.reduce((s, p) => s + (estimateWage(p.value) || 0), 0) * 10) / 10;

    // Discipline budgétaire : moitié valeur d'effectif, moitié masse salariale (les clubs sans
    // encadrement salarial, comme Lens, ont automatiquement le plein sur cette moitié-là).
    const valueRatio = used / club.valueCap;
    const valueBudgetScore = valueRatio <= 1 ? 5 + 7.5 * valueRatio : Math.max(0, 12.5 - (valueRatio - 1) * 50);
    let salaryBudgetScore = 12.5;
    if (!club.noWageCap) {
      const salRatio = wageBill / club.salaryCap;
      salaryBudgetScore = salRatio <= 1 ? 5 + 7.5 * salRatio : Math.max(0, 12.5 - (salRatio - 1) * 50);
    }
    const budgetScore = valueBudgetScore + salaryBudgetScore;

    // Cohérence d'effectif : âge, profondeur du banc, répartition des postes, proportion d'un
    // seul transfert dans le budget — des jugements sur TES décisions de DS, pas sur le réalisme
    // des données (un vrai effectif, même déséquilibré, ne doit pas être pénalisé sur la réalité).
    const withAge = filled.filter((s) => s.player.age);
    const avgAge = withAge.reduce((s, x) => s + x.player.age, 0) / (withAge.length || 1);
    const ageScore = Math.max(0, Math.min(10, 10 - Math.max(0, Math.abs(avgAge - 25.5) - 2.5) * 2));
    const cats = ["GK", "DEF", "MID", "FWD"];
    const benchCatCount = cats.filter((c) => bench.some((p) => p.cat === c)).length;
    const benchDepth = (benchCatCount / 4) * 8;
    const idealRatio = { GK: 0.12, DEF: 0.32, MID: 0.32, FWD: 0.24 };
    const nAll = fullSquad.length || 1;
    let diversityPenalty = 0;
    cats.forEach((c) => { diversityPenalty += Math.abs(fullSquad.filter((p) => p.cat === c).length / nAll - idealRatio[c]); });
    const diversityScore = Math.max(0, 4 - diversityPenalty * 8);
    const maxSingleValue = Math.max(0, ...squadForBudget.map((p) => p.value || 0));
    const spendRatio = club.valueCap ? maxSingleValue / club.valueCap : 0;
    const spendThreshold = club.dncg ? 0.3 : 0.5;
    const spendPropScore = spendRatio <= spendThreshold ? 3 : Math.max(0, 3 - (spendRatio - spendThreshold) * 10);
    const coherence = ageScore + benchDepth + diversityScore + spendPropScore;

    const avgValue = filled.reduce((s, x) => s + (x.player.value || 0), 0) / (filled.length || 1);
    const quality = Math.min(25, (avgValue / (club.valueCap / 5)) * 25);
    return { coverage, budgetScore, coherence, quality, hasValues, wageBill,
      total: coverage + coherence + (hasValues ? budgetScore + quality : 0), partial: !hasValues, used, avgAge: withAge.length ? avgAge : null };
  }, [starters, bench, slots.length, club, squad]);

    if (!club) return { verifiedScore: 0, sizeScore: 0, coherenceScore: 0, rivalPenalty: 0, rivalSignings: [], total: 0, verifiedPct: 0, squadSize: 0 };
    const all = squad.filter((p) => !p.onLoan);
    const n = all.length || 1;

    // Le réalisme ne mesure QUE si l'effectif est crédible/réel — pas si sa forme est "idéale"
    // (ça, c'est le boulot du score mercato). Un vrai effectif actuel doit pouvoir atteindre 100%.
    const verifiedPct = all.filter((p) => p.verified).length / n;
    const verifiedScore = verifiedPct * 65;

    const size = all.length;
    const sizeScore = size >= 16 && size <= 30 ? 20 : Math.max(0, 20 - Math.abs(size < 16 ? 16 - size : size - 30) * 3);

    const rivalSignings = all.filter((p) => isRivalOrigin(club.name, p.fromClub));
    const rivalPenalty = Math.min(15, rivalSignings.length * 15);
    const coherenceScore = 15 - rivalPenalty;

    const rawTotal = verifiedScore + sizeScore + coherenceScore;
    return { verifiedScore, sizeScore, coherenceScore, rivalPenalty, rivalSignings,

      const ourRating = Math.max(30, score.total + (fx.home ? 4 : -4));
      const oppPerf = fx.oppRating + (Math.random() * 24 - 12);
      const ourPerf = ourRating + (Math.random() * 24 - 12);
      const diff = ourPerf - oppPerf;
      let ourGoals, oppGoals;
      if (diff > 6) { ourGoals = 1 + Math.floor(Math.random() * 3); oppGoals = Math.max(0, ourGoals - 1 - Math.floor(Math.random() * 2)); }
      else if (diff < -6) { oppGoals = 1 + Math.floor(Math.random() * 3); ourGoals = Math.max(0, oppGoals - 1 - Math.floor(Math.random() * 2)); }
      else { ourGoals = oppGoals = Math.floor(Math.random() * 3); }
      const outcome = ourGoals > oppGoals ? "win" : ourGoals < oppGoals ? "loss" : "draw";
      const pts = outcome === "win" ? 3 : outcome === "draw" ? 1 : 0;
      const oppPts = outcome === "win" ? 0 : outcome === "draw" ? 1 : 3;
      newTable = newTable.map((row) => {
        if (row.self) return { ...row, pts: row.pts + pts, gf: row.gf + ourGoals, ga: row.ga + oppGoals, played: row.played + 1 };
        if (row.name === fx.opponent) return { ...row, pts: row.pts + oppPts, gf: row.gf + oppGoals, ga: row.ga + ourGoals, played: row.played + 1 };
        return row;
      });
      return { ...fx, played: true, result: { ourGoals, oppGoals, outcome } };
    });
    newTable = newTable.sort((a, b) => b.pts - a.pts || (b.gf - b.ga) - (a.gf - a.ga));

                  <div className="ft-share-moves">
                    {mercatoMoves.arrivals.length > 0 && (
                      <div className="ft-share-move-col">
                        <div className="ft-share-move-title">↗️ Arrivées ({mercatoMoves.arrivals.length}) · {fmtValue(mercatoMoves.spent)}</div>
                        {mercatoMoves.arrivals.slice(0, 6).map((p) => <div key={p.id} className="ft-share-move-item">{shortName(p.name)}</div>)}
                      </div>
                    )}
                    {mercatoMoves.departures.length > 0 && (
                      <div className="ft-share-move-col">
                        <div className="ft-share-move-title">↘️ Départs ({mercatoMoves.departures.length}) · {fmtValue(mercatoMoves.recovered)}</div>
                        {mercatoMoves.departures.slice(0, 6).map((p) => <div key={p.id} className="ft-share-move-item">{shortName(p.name)}</div>)}
                      </div>
                    )}
                  </div>
                )}
                <div className="ft-share-xi">
                  {starters.filter((s) => s.player).map(({ player }) => (
                    <div key={player.id} className="ft-share-player">
                      <span className="ft-share-num" style={{ background: club.c1, color: club.c2 }}>{player.num}</span>
                      {shortName(player.name)}
                    </div>
                  ))}
                </div>
                <div className="ft-share-footer">⚽ Fais ton Mercato</div>
              </div>
            )}
            <button className="ft-mini-btn ft-buy" style={{ width: "100%", padding: "10px 0" }} onClick={downloadCard}>📸 Télécharger ma carte</button>
            <button className="ft-mini-btn" style={{ width: "100%", padding: "10px 0", marginTop: 6 }} onClick={loadLeaderboard}>🏅 Voir le classement {club.name}</button>

            {showLeaderboard && (
              <div className="ft-table" style={{ marginTop: 10 }}>
                <div className="ft-table-head"><span>#</span><span>Joueur</span><span>Réal.</span><span>Score</span></div>
                {leaderboardLoading && <div className="ft-row-sub" style={{ padding: 8 }}>Chargement…</div>}
                {!leaderboardLoading && leaderboard.length === 0 && <div className="ft-row-sub" style={{ padding: 8 }}>Personne pour l'instant — sois le premier !</div>}
                {!leaderboardLoading && leaderboard.map((row, i) => (
                  <div key={row.user_id} className={`ft-table-row ${session && row.user_id === session.user.id ? "ft-table-self" : ""}`}>
                    <span>{i + 1}</span><span>{row.display_name}</span><span>{row.realism_score}</span><span>{row.global_avg}</span>
                  </div>
                ))}
              </div>
            )}

            <div className="ft-reset-link" style={{ textAlign: "center", marginTop: 4 }} onClick={() => setMercatoRevealed(false)}>← Continuer à modifier mon mercato</div>
          </>)}
          </div>
          </div>
        </>)}

        {view === "market" && club && (<>
          <button className="ft-back-btn" style={{ marginBottom: 12 }} onClick={() => setView("home")}>← Accueil</button>
          {club.dncg && (
            <div className={`ft-dncg ${dncgDone ? "ft-dncg-done" : ""}`}>
              <Icon>{dncgDone ? "✅" : "⚠️"}</Icon>
              <div style={{ flex: 1 }}>
                {dncgDone ? "Objectif DNCG atteint — la pression financière retombe." : `Contrainte DNCG : céder ${DNCG_TARGET}M€ de joueurs. Progression : ${dncgSold}M€ / ${DNCG_TARGET}M€.`}
                <div className="ft-dncg-track"><div className="ft-dncg-fill" style={{ width: `${Math.min(100, (dncgSold / DNCG_TARGET) * 100)}%` }} /></div>
              </div>
            </div>
          )}
          <div className="ft-market-grid">
          <div className="ft-market-left">
          <div className="ft-market-budget"><Icon>💰</Icon> Budget mercato disponible<b>{transferBudget}M€</b></div>

          <div className="ft-section-label"><span>Pistes du mercato</span></div>
          {marketPool.length === 0 ? (
            <div className="ft-row-sub" style={{ marginBottom: 10 }}>Pas de pistes pré-suggérées pour ce club — utilise la recherche ci-dessous pour trouver de vrais joueurs.</div>
          ) : (<>
            <div className="ft-search"><Icon>🔍</Icon><input placeholder="Filtrer la liste…" value={marketSearch} onChange={(e) => setMarketSearch(e.target.value)} /></div>
            {filteredMarket.map((p) => (
              <div key={p.id} className="ft-row">
                <div className="ft-row-num">{p.cat}</div>
                <div><div className="ft-row-name">{p.name}</div><div className="ft-row-sub">{p.pos} · {p.age} ans</div></div>
                <div className="ft-row-actions">
                  <button className="ft-mini-btn ft-buy" disabled={transferBudget < p.value} onClick={() => buyPlayer(p)}>Acheter · {fmtValue(p.value)}</button>
                  <button className="ft-mini-btn" onClick={() => loanInSimple(p)}>Prêter</button>
                  <button className="ft-mini-btn" onClick={() => loanInWithOA(p)}>Prêter · OA {fmtValue(calcOA(p.value, p.age))}</button>
                  <button className="ft-mini-btn ft-sell" onClick={() => setMarketPool((m) => m.filter((x) => x.id !== p.id))}>✕</button>
                </div>
              </div>
            ))}
          </>)}

          <div className="ft-custom">
            <div className="ft-custom-title"><Icon>🔎</Icon> Chercher un vrai joueur</div>
            <div className="ft-search" style={{ marginBottom: 8 }}>
              <input placeholder="Ex. Kilian Sildillia" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} onKeyDown={(e) => e.key === "Enter" && searchPlayer()} />
              <button className="ft-mini-btn ft-buy" onClick={searchPlayer} disabled={searching}>{searching ? "…" : "Chercher"}</button>
            </div>
            <div className="ft-search-filters">
              <input placeholder="Club (optionnel)" value={searchClub} onChange={(e) => setSearchClub(e.target.value)} onKeyDown={(e) => e.key === "Enter" && searchPlayer()} />
              <select value={searchNat} onChange={(e) => setSearchNat(e.target.value)}>
                <option value="">Nationalité (optionnel)</option>
                {COUNTRIES_FR.map(([en, fr]) => <option key={en} value={en}>{fr}</option>)}
              </select>
            </div>
            {searchResults.length > 0 && (
              <div className="ft-search-results ft-search-results-scroll">
                {searchResults.map((r) => (
                  <div key={r.id} className="ft-search-result" onClick={() => pickSearchResult(r)}>
                    {r.photo ? <img className="ft-row-photo" src={r.photo} alt="" /> : <div className="ft-row-num">{POS_MAP[r.position] || r.position || "?"}</div>}
                    <div><div className="ft-row-name">{r.flagCode && <img src={`https://flagcdn.com/w20/${r.flagCode}.png`} alt="" style={{ width: 14, marginRight: 5, verticalAlign: "middle" }} />}{r.name}</div><div className="ft-row-sub">{r.team || "club inconnu"} · {CAT_LABEL[POS_MAP[r.position] || r.position] || r.position || "poste inconnu"}{r.subPos ? ` · ${r.subPos}` : ""} · {r.age ? `${r.age} ans` : ""}{r.nationality ? ` · ${r.nationality}` : ""}</div></div>
                  </div>
                ))}
              </div>
            )}
            <div className="ft-custom-title" style={{ marginTop: 12 }}><Icon>➕</Icon> Ou remplis à la main</div>
            <div className="ft-custom-grid">
              <input placeholder="Nom du joueur" value={customForm.name} onChange={(e) => setCustomForm((f) => ({ ...f, name: e.target.value }))} />
              <select value={customForm.cat} onChange={(e) => setCustomForm((f) => ({ ...f, cat: e.target.value }))}>
                <option value="" disabled>Poste</option>
                <option value="GK">Gardien</option><option value="DEF">Défenseur</option><option value="MID">Milieu</option><option value="FWD">Attaquant</option>
              </select>
              <input type="number" placeholder="Âge" value={customForm.age} onChange={(e) => setCustomForm((f) => ({ ...f, age: e.target.value }))} />
              <input type="number" placeholder="Valeur (M€)" value={customForm.value} onChange={(e) => setCustomForm((f) => ({ ...f, value: e.target.value }))} />
              <input type="number" placeholder="Numéro (optionnel)" value={customForm.num} onChange={(e) => setCustomForm((f) => ({ ...f, num: e.target.value }))} />
              <input placeholder="Club d'origine (optionnel)" value={customForm.fromClub} onChange={(e) => setCustomForm((f) => ({ ...f, fromClub: e.target.value }))} />
            </div>
            <div className="ft-custom-actions">
              <button className="ft-mini-btn ft-buy" onClick={addCustomPlayer}>Ajouter comme piste</button>
            </div>
          </div>

          </div>

          <div className="ft-market-right">
          <div className="ft-section-label"><span>Votre effectif</span></div>
          {squad.filter((p) => !p.onLoan).map((p) => (
            <div key={p.id} className="ft-row" style={{ flexWrap: "wrap" }}>
              {p.photo && <img className="ft-row-photo" src={p.photo} alt="" />}
              <input className="ft-num-input" type="number" value={p.num} min={1} max={99} onChange={(e) => updateNumber(p.id, e.target.value)} />
              <div>
                <div className="ft-row-name">
                  {p.name}
                  {p.saleTag && <span className="ft-tag-sale">en instance de départ</span>}
                  {p.loanedIn && <span className="ft-tag-loan">prêté au club</span>}
                  {!p.verified && <span className="ft-tag-fictif">fictif</span>}
                  {p.overridden && isAdmin && <span className="ft-tag-loan">✓ corrigé</span>}
                  {isRivalOrigin(club.name, p.fromClub) && <span className="ft-tag-sale">rival historique</span>}
                </div>
                <div className="ft-row-sub">{posLine(p)} · {p.age ? `${p.age} ans` : "âge n.c."} · {fmtValue(p.value)} · {monthlySalaryK(p) != null ? `${monthlySalaryK(p)}K€/mois` : "salaire n.c."} · contrat jusqu'en {p.contractEnd}</div>
              </div>
              <div className="ft-row-actions">
                {p.contractEnd <= 2027 && <button className="ft-mini-btn" onClick={() => renewContract(p)}>Prolonger</button>}
                <button className="ft-mini-btn" onClick={() => loanOutPlayer(p, false)}>Prêter</button>
                <button className="ft-mini-btn" onClick={() => loanOutPlayer(p, true)}>Prêter +OA</button>
                <button className="ft-mini-btn ft-sell" onClick={() => sellPlayer(p)}>Vendre{p.value != null ? ` · ${fmtValue(sellFee(p.value))}` : ""}</button>
                {p.verified && isAdmin && <button className="ft-mini-btn" onClick={() => startEditPlayer(p)}>✏️ corriger</button>}
              </div>
              {editingPlayer === p.id && (
                <div className="ft-edit-form">
                  <input type="number" placeholder="Valeur M€" value={editForm.value} onChange={(e) => setEditForm((f) => ({ ...f, value: e.target.value }))} />
                  <input type="number" placeholder="Salaire K€/mois" value={editForm.salary} onChange={(e) => setEditForm((f) => ({ ...f, salary: e.target.value }))} />
                  <input type="number" placeholder="Contrat jusqu'en" value={editForm.contractEnd} onChange={(e) => setEditForm((f) => ({ ...f, contractEnd: e.target.value }))} />
                  <button className="ft-mini-btn ft-buy" onClick={() => saveEditPlayer(p)}>Enregistrer</button>
                  <button className="ft-mini-btn" onClick={() => setEditingPlayer(null)}>Annuler</button>
                </div>
              )}
            </div>
          ))}

          {onLoanList.length > 0 && (<>
            <div className="ft-section-label"><span>Joueurs prêtés</span></div>
            {onLoanList.map((p) => (
              <div key={p.id} className="ft-row">
                <div className="ft-row-num">{p.num}</div>
                <div><div className="ft-row-name">{p.name}{p.loanOA && <span className="ft-oa">OA</span>}</div><div className="ft-row-sub">{p.pos}</div></div>
                <div className="ft-row-actions"><button className="ft-mini-btn" onClick={() => recallPlayer(p)}><Icon size={11}>↩️</Icon> Rappeler</button></div>
              </div>
            ))}
          </>)}
          </div>
          </div>
        </>)}

        {view === "season" && club && fixtures && table && (<>
          <div className="ft-board">
            <div className="ft-board-obj"><Icon>🎯</Icon> Objectif indicatif : {BOARD_OBJECTIVES[activeKey] || "assurer le maintien"}</div>
          </div>

          {seasonResult && (
            <div className={`ft-dncg ${seasonResult.rank <= 5 ? "ft-dncg-done" : ""}`}>
              <Icon>🏆</Icon>
              <div style={{ flex: 1 }}>Saison simulée : {seasonResult.rank}{seasonResult.rank === 1 ? "ère" : "ème"} place avec {seasonResult.pts} points sur {seasonResult.played} matchs.</div>
            </div>
          )}

          <div className="ft-section-label"><span>Classement (10 journées, pour le fun)</span></div>
          <div className="ft-table">
            <div className="ft-table-head"><span>#</span><span>Club</span><span>J</span><span>Pts</span></div>
            {table.map((row, i) => (
              <div key={row.name} className={`ft-table-row ${row.self ? "ft-table-self" : ""}`}>
                <span>{i + 1}</span><span>{row.name}</span><span>{row.played}</span><span>{row.pts}</span>
              </div>
            ))}
          </div>

          {fixtures.some((f) => !f.played) ? (
            <button className="ft-mini-btn ft-buy" style={{ width: "100%", padding: "12px 0", marginTop: 10 }} onClick={simulateSeason}>⚡ Simuler toute la saison en un clic</button>
          ) : (
            <div className="ft-row-sub" style={{ textAlign: "center", marginTop: 10 }}>Calendrier terminé.</div>
          )}

          <div className="ft-section-label"><span>Journal du mercato</span></div>
          <div className="ft-news">
            {transferLog.length === 0 && <div className="ft-row-sub">Aucun mouvement enregistré pour l'instant.</div>}
            {transferLog.map((n, i) => <div key={i} className="ft-news-item">{n}</div>)}
          </div>
        </>)}

        <div className="ft-footnote">
          <Icon>ℹ️</Icon> Valeurs et salaires estimés (âge/poste) — pas des données officielles.
          {view === "squad" && <span className="ft-reset-link" style={{ marginLeft: "auto" }} onClick={refreshLive}>actualiser</span>}
          {view === "squad" && <span className="ft-reset-link" onClick={saveGame}>💾 sauvegarder</span>}
          {view === "squad" && <span className="ft-reset-link" onClick={restartGame}>recommencer</span>}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<FaisTonMercato />);
</script>
