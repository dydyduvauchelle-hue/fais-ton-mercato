// Rivalités historiques : un transfert direct entre ces clubs est possible
// dans la vraie vie, mais extrêmement rare — pénalise donc le score de réalisme.
const RIVAL_PAIRS = [["marseille", "paris"], ["arsenal", "tottenham"], ["real madrid", "barcelona"], ["madrid", "barcelona"]];
function isRivalOrigin(clubName, originClub) {
  if (!originClub) return false;
  const a = clubName.toLowerCase(), b = originClub.toLowerCase();
  return RIVAL_PAIRS.some(([x, y]) => (a.includes(x) && b.includes(y)) || (a.includes(y) && b.includes(x)));
}

    { id: "FR", cat: "FWD", top: 19, left: 80 },
  ],
};

function assignSlots(squad, formationKey) {
  const slots = FORMATIONS[formationKey];
  const pool = squad.filter((p) => !p.onLoan);
  const used = new Set();
  const assignment = {};
  slots.forEach((slot) => {
    const candidate = pool.find((p) => p.cat === slot.cat && !used.has(p.id));
    if (candidate) { assignment[candidate.id] = slot.id; used.add(candidate.id); }
  });
  const remaining = pool.filter((p) => !used.has(p.id));
  remaining.forEach((p, i) => { assignment[p.id] = i < BENCH_SIZE ? "BENCH" : "RESERVE"; });
  return assignment;
}
function shortName(name) { const parts = name.split(" "); return parts.length > 1 ? parts[parts.length - 1] : name; }
function fmtValue(v) { return v == null ? "n.c." : `${v}M€`; }

function estimateValue(age, cat, num) {
  const base = { GK: 8, DEF: 12, MID: 15, FWD: 18 }[cat] || 10;
  let ageMult;
  if (age == null) ageMult = 0.8;
  else if (age <= 20) ageMult = 1.1;
  else if (age <= 23) ageMult = 1.3;
  else if (age <= 27) ageMult = 1.5;
  else if (age <= 30) ageMult = 1.1;
  else if (age <= 33) ageMult = 0.6;
  else ageMult = 0.3;
  const jitter = 0.85 + ((num || 0) % 10) * 0.03;
  return Math.max(1, Math.round(base * ageMult * jitter));
}
function estimateWage(value) {
  if (value == null) return null;
  return Math.max(0.3, Math.round(value * 0.18 * 10) / 10);
}

function ClubCrest({ club, size = 40, logoUrl }) {
  if (logoUrl) return <img src={logoUrl} alt={club.code} width={size} height={size} style={{ objectFit: "contain", flexShrink: 0 }} />;
  return (
    <div className="ft-crest" style={{ width: size, height: size * 1.12,
      background: `linear-gradient(165deg, ${club.c1} 0%, ${club.c1} 52%, ${club.c2} 52%, ${club.c2} 100%)`, fontSize: size * 0.24 }}>{club.code}</div>
  );
}
function Jersey({ club, num, empty }) {
  return (
    <span className={`ft-jersey ${empty ? "ft-jersey-empty" : ""}`}>
      {!empty && (<>
        <span className="ft-jersey-sleeve ft-jersey-sleeve-l" style={{ background: club.c1 }} />
        <span className="ft-jersey-sleeve ft-jersey-sleeve-r" style={{ background: club.c1 }} />

      </>)}
      <span className="ft-jersey-num" style={empty ? {} : { color: club.c2 }}>{empty ? "+" : num}</span>
    </span>
  );
}
function Skeleton({ count = 6 }) {
  return (
    <div className="ft-grid">
      {Array.from({ length: count }).map((_, i) => <div key={i} className="ft-skeleton" />)}
    </div>
  );
}

function makeFixtures(club) {
  const others = RIVALS.filter((r) => !(club.matchNames || []).some((n) => r.name.toLowerCase().includes(n)) && !r.name.toLowerCase().includes(club.name.toLowerCase())).slice(0, 10);
  return others.map((r, i) => ({ id: i, opponent: r.name, oppRating: r.rating, home: i % 2 === 0, played: false, result: null }));
}
function makeTable(club) {
  const others = RIVALS.filter((r) => !(club.matchNames || []).some((n) => r.name.toLowerCase().includes(n)) && !r.name.toLowerCase().includes(club.name.toLowerCase())).slice(0, 10);
  return [{ name: club.name, pts: 0, gf: 0, ga: 0, played: 0, self: true }, ...others.map((r) => ({ name: r.name, pts: 0, gf: 0, ga: 0, played: 0 }))];
}

    const filled = starters.filter((s) => s.player);

  const loanOutPlayer = (p, withOA) => {

    setFlash(`${p.name} prêté ${withOA ? "avec option d'achat" : "sans option d'achat"}.`);

  const renewContract = (p) => {
    const fee = Math.max(1, Math.round(p.value * 0.1 * 10) / 10);
    if (transferBudget < fee) { setFlash("Budget insuffisant pour cette prolongation."); return; }
    setTransferBudget((b) => Math.round((b - fee) * 10) / 10);
    setSquad((s) => s.map((x) => (x.id === p.id ? { ...x, contractEnd: x.contractEnd + 2 } : x)));
    logTransfer(`Prolongation : ${p.name} jusqu'en ${p.contractEnd + 2} (${fee}M€ de prime).`);
    setFlash(`${p.name} a prolongé (${fee}M€ de prime).`);
  };

  const simulateSeason = () => {
    if (!fixtures) return;
    let newTable = table.map((r) => ({ ...r }));
    const newFixtures = fixtures.map((fx) => {
      if (fx.played) return fx;
      const ourRating = Math.max(30, score.total + (fx.home ? 4 : -4));
      const oppPerf = fx.oppRating + (Math.random() * 24 - 12);
      const ourPerf = ourRating + (Math.random() * 24 - 12);
      const diff = ourPerf - oppPerf;
      let ourGoals, oppGoals;
      if (diff > 6) { ourGoals = 1 + Math.floor(Math.random() * 3); oppGoals = Math.max(0, ourGoals - 1 - Math.floor(Math.random() * 2)); }
      else if (diff < -6) { oppGoals = 1 + Math.floor(Math.random() * 3); ourGoals = Math.max(0, oppGoals - 1 - Math.floor(Math.random() * 2)); }
      else { ourGoals = oppGoals = Math.floor(Math.random() * 3); }
      const outcome = ourGoals > oppGoals ? "win" : ourGoals < oppGoals ? "loss" : "draw";
      const pts = outcome === "win" ? 3 : outcome === "draw" ? 1 : 0;
      const oppPts = outcome === "win" ? 0 : outcome === "draw" ? 1 : 3;
      newTable = newTable.map((row) => {
        if (row.self) return { ...row, pts: row.pts + pts, gf: row.gf + ourGoals, ga: row.ga + oppGoals, played: row.played + 1 };
        if (row.name === fx.opponent) return { ...row, pts: row.pts + oppPts, gf: row.gf + oppGoals, ga: row.ga + ourGoals, played: row.played + 1 };
        return row;
      });
      return { ...fx, played: true, result: { ourGoals, oppGoals, outcome } };
    });
    newTable = newTable.sort((a, b) => b.pts - a.pts || (b.gf - b.ga) - (a.gf - a.ga));
    setFixtures(newFixtures);
    setTable(newTable);
    const rank = newTable.findIndex((r) => r.self) + 1;
    const self = newTable.find((r) => r.self);
    setSeasonResult({ rank, pts: self.pts, played: self.played });
    setFlash(`Saison simulée : ${rank}${rank === 1 ? "er" : "ème"} place, ${self.pts} points.`);
  };

  const addCustomPlayer = (mode) => {
    if (!customForm.name.trim()) return;
    const base = { id: `custom-${Date.now()}`, name: customForm.name.trim(), cat: customForm.cat, pos: CAT_LABEL[customForm.cat],
      age: Number(customForm.age) || 20, value: Number(customForm.value) || 1, photo: customForm.photo || null, verified: !!customForm.verified, fromClub: customForm.fromClub || "" };
    const rival = isRivalOrigin(club.name, base.fromClub);
    if (mode === "achat") { setMarketPool((m) => [...m, base]); setFlash(`${base.name} ajouté aux pistes du marché.${rival ? " ⚠️ Rival historique — signature très rare en vrai." : ""}`); }
    else {
      const fee = Math.max(1, Math.round(base.value * 0.15 * 10) / 10);
      if (transferBudget < fee) { setFlash("Budget insuffisant pour ce prêt."); return; }
      setTransferBudget((b) => Math.round((b - fee) * 10) / 10);
      setSquad((s) => [...s, { ...base, num: Number(customForm.num) || 99, onLoan: false, loanOA: false, loanedIn: true }]);
      logTransfer(`Prêt entrant : ${base.name} (indemnité ${fee}M€).`);
      setFlash(`${base.name} arrive en prêt (indemnité ${fee}M€).${rival ? " ⚠️ Rival historique." : ""}`);

    setSearchResults([]);

      const data = await r.json();
      if (data.error) throw new Error(data.error);
      setSearchResults(data.results || []);
      if (!data.results || data.results.length === 0) setFlash("Aucune correspondance trouvée.");
    } catch (err) { setFlash(`Recherche échouée : ${err.message}`); } finally { setSearching(false); }

      {flash && <div className="ft-flash">{flash}</div>}

      {showAuth && (

          <div className="ft-modal ft-modal-wide" onClick={(e) => e.stopPropagation()}>

            <div className="ft-account-tabs">

            {accountTab === "profile" && (<>
              <div className="ft-row-sub" style={{ marginBottom: 6 }}>Nom affiché</div>

          <div className="ft-reserve">
            {reserve.map((p) => (
              <div key={p.id} className={`ft-res-pill ${selected === p.id ? "ft-chip-sel" : ""}`} onClick={() => handleSelect(p.id)}
                draggable onDragStart={(e) => e.dataTransfer.setData("text/plain", p.id)}
                onDragOver={(e) => e.preventDefault()}
                onDrop={(e) => { e.preventDefault(); swapPlayers(e.dataTransfer.getData("text/plain"), p.id); }}>
                <span className="ft-res-num">{p.num}</span>{shortName(p.name)}
              </div>
            ))}
          </div>

          {!mercatoRevealed ? (
            <button className="ft-mini-btn ft-buy" style={{ width: "100%", padding: "12px 0", marginTop: 16, fontSize: 12 }} onClick={() => setMercatoRevealed(true)}>
              🏁 Terminer mon mercato — voir mon bilan
            </button>
          ) : (<>
            <div className="ft-score ft-fade-in">
              <div className="ft-score-head">
                <div className="ft-gauge" style={{ "--pct": Math.round(score.total) }}><div className="ft-gauge-inner"><div className="ft-gauge-num">{Math.round(score.total)}</div><div className="ft-gauge-sub">/100</div></div></div>
                <div><div className="ft-score-title">Note du mercato {score.partial && "(partielle)"}</div><div className="ft-score-desc">Âge moyen du onze : {score.avgAge ? score.avgAge.toFixed(1) : "n.c."} ans</div></div>
              </div>
              <Bar label="Couverture des postes" value={score.coverage} />
              {score.hasValues ? <Bar label="Discipline budgétaire" value={score.budgetScore} /> : <div className="ft-bar-row"><div className="ft-bar-label">Discipline budgétaire</div><div className="ft-bar-track"><div className="ft-bar-fill ft-na" /></div><div className="ft-bar-value">n.c.</div></div>}
              <Bar label="Cohérence d'effectif" value={score.coherence} />
              {score.hasValues ? <Bar label="Valeur du recrutement" value={score.quality} /> : <div className="ft-bar-row"><div className="ft-bar-label">Valeur du recrutement</div><div className="ft-bar-track"><div className="ft-bar-fill ft-na" /></div><div className="ft-bar-value">n.c.</div></div>}
            </div>

            <div className="ft-score ft-fade-in">
              <div className="ft-score-head">
                <div className="ft-gauge" style={{ "--pct": Math.round(realism.total) }}><div className="ft-gauge-inner"><div className="ft-gauge-num">{Math.round(realism.total)}</div><div className="ft-gauge-sub">/100</div></div></div>
                <div><div className="ft-score-title">Cohérence à la réalité</div><div className="ft-score-desc">{realism.squadSize} joueurs · {Math.round(realism.verifiedPct * 100)}% vérifiés</div></div>
              </div>
              <Bar label="Joueurs réels vérifiés" value={realism.verifiedScore} max={40} />
              <Bar label="Taille d'effectif plausible" value={realism.sizeScore} max={20} />
              <Bar label="Aucun transfert délirant" value={realism.spendScore} max={20} />
              <Bar label="Répartition des postes" value={realism.diversityScore} max={20} />
              {realism.rivalPenalty > 0 && <div className="ft-row-sub" style={{ color: "var(--coral)" }}>⚠️ -{realism.rivalPenalty} pts : {realism.rivalSignings.map((p) => p.name).join(", ")} vien{realism.rivalSignings.length > 1 ? "nent" : "t"} d'un rival historique (rarissime en vrai).</div>}
            </div>

            {trophies.length > 0 && (
              <div className="ft-trophies">
                {trophies.map((t) => (
                  <div key={t.label} className="ft-trophy" title={t.desc}>
                    <span className="ft-trophy-icon">{t.icon}</span>
                    <span className="ft-trophy-label">{t.label}</span>
                  </div>
                ))}
              </div>
            )}

            <div id="share-card" className="ft-share-card">
              <div className="ft-share-head">
                <ClubCrest club={club} size={40} logoUrl={logosCache[activeKey]?.logo} />
                <div>
                  <div className="ft-share-club">{club.name}</div>
                  <div className="ft-share-sub">Mercato 2026-2027 · {formation}</div>
                </div>
              </div>
              <div className="ft-share-title">{dsTitle}</div>
              <div className="ft-share-scores">
                <div className="ft-share-score-box"><div className="ft-share-score-num">{Math.round(score.total)}</div><div className="ft-share-score-label">Note mercato</div></div>
                <div className="ft-share-score-box"><div className="ft-share-score-num">{Math.round(realism.total)}</div><div className="ft-share-score-label">Réalisme</div></div>
              </div>
              <div className="ft-share-xi">
                {starters.filter((s) => s.player).map(({ player }) => (
                  <div key={player.id} className="ft-share-player">
                    <span className="ft-share-num" style={{ background: club.c1, color: club.c2 }}>{player.num}</span>
                    {shortName(player.name)}
                  </div>
                ))}
              </div>
              <div className="ft-share-footer">⚽ Fais ton Mercato</div>
            </div>
            <button className="ft-mini-btn ft-buy" style={{ width: "100%", padding: "10px 0" }} onClick={downloadCard}>📸 Télécharger ma carte</button>
            <button className="ft-mini-btn" style={{ width: "100%", padding: "10px 0", marginTop: 6 }} onClick={loadLeaderboard}>🏅 Voir le classement {club.name}</button>

            {showLeaderboard && (
              <div className="ft-table" style={{ marginTop: 10 }}>
                <div className="ft-table-head"><span>#</span><span>Joueur</span><span>Réal.</span><span>Score</span></div>
                {leaderboardLoading && <div className="ft-row-sub" style={{ padding: 8 }}>Chargement…</div>}
                {!leaderboardLoading && leaderboard.length === 0 && <div className="ft-row-sub" style={{ padding: 8 }}>Personne pour l'instant — sois le premier !</div>}
                {!leaderboardLoading && leaderboard.map((row, i) => (
                  <div key={row.user_id} className={`ft-table-row ${session && row.user_id === session.user.id ? "ft-table-self" : ""}`}>
                    <span>{i + 1}</span><span>{row.display_name}</span><span>{row.realism_score}</span><span>{row.global_avg}</span>
                  </div>
                ))}
              </div>
            )}

            <div className="ft-reset-link" style={{ textAlign: "center", marginTop: 4 }} onClick={() => setMercatoRevealed(false)}>← Continuer à modifier mon mercato</div>
          </>)}
        </>)}

        {view === "market" && club && (<>
          {club.dncg && (
            <div className={`ft-dncg ${dncgDone ? "ft-dncg-done" : ""}`}>
              <Icon>{dncgDone ? "✅" : "⚠️"}</Icon>
              <div style={{ flex: 1 }}>
                {dncgDone ? "Objectif DNCG atteint — la pression financière retombe." : `Contrainte DNCG : céder ${DNCG_TARGET}M€ de joueurs. Progression : ${dncgSold}M€ / ${DNCG_TARGET}M€.`}
                <div className="ft-dncg-track"><div className="ft-dncg-fill" style={{ width: `${Math.min(100, (dncgSold / DNCG_TARGET) * 100)}%` }} /></div>
              </div>
            </div>
          )}
          <div className="ft-market-budget"><Icon>💰</Icon> Budget mercato disponible<b>{transferBudget}M€</b></div>

          <div className="ft-section-label"><span>Pistes du mercato</span></div>
          <div className="ft-search"><Icon>🔍</Icon><input placeholder="Filtrer la liste…" value={marketSearch} onChange={(e) => setMarketSearch(e.target.value)} /></div>
          {filteredMarket.map((p) => (
            <div key={p.id} className="ft-row">
              <div className="ft-row-num">{p.cat}</div>
              <div><div className="ft-row-name">{p.name}</div><div className="ft-row-sub">{p.pos} · {p.age} ans</div></div>
              <div className="ft-row-actions"><button className="ft-mini-btn ft-buy" disabled={transferBudget < p.value} onClick={() => buyPlayer(p)}>Acheter · {fmtValue(p.value)}</button></div>
            </div>
          ))}

          <div className="ft-custom">
            <div className="ft-custom-title"><Icon>🔎</Icon> Chercher un vrai joueur</div>
            <div className="ft-search" style={{ marginBottom: 8 }}>
              <input placeholder="Ex. Kilian Sildillia" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} onKeyDown={(e) => e.key === "Enter" && searchPlayer()} />
              <button className="ft-mini-btn ft-buy" onClick={searchPlayer} disabled={searching}>{searching ? "…" : "Chercher"}</button>
            </div>
            {searchResults.length > 0 && (
              <div className="ft-search-results">
                {searchResults.map((r) => (
                  <div key={r.id} className="ft-search-result" onClick={() => pickSearchResult(r)}>
                    {r.photo ? <img className="ft-row-photo" src={r.photo} alt="" /> : <div className="ft-row-num">{POS_MAP[r.position] || r.position || "?"}</div>}
                    <div><div className="ft-row-name">{r.name}</div><div className="ft-row-sub">{r.team || "club inconnu"} · {r.position || "poste inconnu"} · {r.age ? `${r.age} ans` : ""}</div></div>
                  </div>
                ))}
              </div>
            )}
            <div className="ft-custom-title" style={{ marginTop: 12 }}><Icon>➕</Icon> Ou remplis à la main</div>
            <div className="ft-custom-grid">
              <input placeholder="Nom du joueur" value={customForm.name} onChange={(e) => setCustomForm((f) => ({ ...f, name: e.target.value }))} />
              <select value={customForm.cat} onChange={(e) => setCustomForm((f) => ({ ...f, cat: e.target.value }))}>
                <option value="GK">Gardien</option><option value="DEF">Défenseur</option><option value="MID">Milieu</option><option value="FWD">Attaquant</option>
              </select>
              <input type="number" placeholder="Âge" value={customForm.age} onChange={(e) => setCustomForm((f) => ({ ...f, age: e.target.value }))} />
              <input type="number" placeholder="Valeur (M€)" value={customForm.value} onChange={(e) => setCustomForm((f) => ({ ...f, value: e.target.value }))} />
              <input type="number" placeholder="Numéro (optionnel)" value={customForm.num} onChange={(e) => setCustomForm((f) => ({ ...f, num: e.target.value }))} />
              <input placeholder="Club d'origine (optionnel)" value={customForm.fromClub} onChange={(e) => setCustomForm((f) => ({ ...f, fromClub: e.target.value }))} />
            </div>
            <div className="ft-custom-actions">
              <button className="ft-mini-btn ft-buy" onClick={() => addCustomPlayer("achat")}>Ajouter comme piste d'achat</button>
              <button className="ft-mini-btn" onClick={() => addCustomPlayer("pret")}>Faire venir en prêt</button>
            </div>
          </div>

          <div className="ft-section-label"><span>Votre effectif</span></div>
          {squad.filter((p) => !p.onLoan).map((p) => (
            <div key={p.id} className="ft-row">
              {p.photo && <img className="ft-row-photo" src={p.photo} alt="" />}
              <input className="ft-num-input" type="number" value={p.num} min={1} max={99} onChange={(e) => updateNumber(p.id, e.target.value)} />
              <div>
                <div className="ft-row-name">
                  {p.name}
                  {p.saleTag && <span className="ft-tag-sale">en instance de départ</span>}
                  {p.loanedIn && <span className="ft-tag-loan">prêté au club</span>}
                  {!p.verified && <span className="ft-tag-fictif">fictif</span>}
                  {isRivalOrigin(club.name, p.fromClub) && <span className="ft-tag-sale">rival historique</span>}
                </div>
                <div className="ft-row-sub">{p.pos} · {p.age ? `${p.age} ans` : "âge n.c."} · {fmtValue(p.value)} · contrat jusqu'en {p.contractEnd}</div>
              </div>
              <div className="ft-row-actions">
                {p.contractEnd <= 2027 && <button className="ft-mini-btn" onClick={() => renewContract(p)}>Prolonger</button>}
                <button className="ft-mini-btn" onClick={() => loanOutPlayer(p, false)}>Prêter</button>
                <button className="ft-mini-btn" onClick={() => loanOutPlayer(p, true)}>Prêter +OA</button>
                <button className="ft-mini-btn ft-sell" onClick={() => sellPlayer(p)}>Vendre{p.value != null ? ` · ${Math.round(p.value * 0.9 * 10) / 10}M€` : ""}</button>
              </div>
            </div>
          ))}

          {onLoanList.length > 0 && (<>
            <div className="ft-section-label"><span>Joueurs prêtés</span></div>
            {onLoanList.map((p) => (
              <div key={p.id} className="ft-row">
                <div className="ft-row-num">{p.num}</div>
                <div><div className="ft-row-name">{p.name}{p.loanOA && <span className="ft-oa">OA</span>}</div><div className="ft-row-sub">{p.pos}</div></div>
                <div className="ft-row-actions"><button className="ft-mini-btn" onClick={() => recallPlayer(p)}><Icon size={11}>↩️</Icon> Rappeler</button></div>
              </div>
            ))}
          </>)}
        </>)}

        {view === "season" && club && fixtures && table && (<>
          <div className="ft-board">
            <div className="ft-board-obj"><Icon>🎯</Icon> Objectif indicatif : {BOARD_OBJECTIVES[activeKey] || "assurer le maintien"}</div>
          </div>

          {seasonResult && (
            <div className={`ft-dncg ${seasonResult.rank <= 5 ? "ft-dncg-done" : ""}`}>
              <Icon>🏆</Icon>
              <div style={{ flex: 1 }}>Saison simulée : {seasonResult.rank}{seasonResult.rank === 1 ? "ère" : "ème"} place avec {seasonResult.pts} points sur {seasonResult.played} matchs.</div>
            </div>
          )}

          <div className="ft-section-label"><span>Classement (10 journées, pour le fun)</span></div>
          <div className="ft-table">
            <div className="ft-table-head"><span>#</span><span>Club</span><span>J</span><span>Pts</span></div>
            {table.map((row, i) => (
              <div key={row.name} className={`ft-table-row ${row.self ? "ft-table-self" : ""}`}>
                <span>{i + 1}</span><span>{row.name}</span><span>{row.played}</span><span>{row.pts}</span>
              </div>
            ))}
          </div>

          {fixtures.some((f) => !f.played) ? (
            <button className="ft-mini-btn ft-buy" style={{ width: "100%", padding: "12px 0", marginTop: 10 }} onClick={simulateSeason}>⚡ Simuler toute la saison en un clic</button>
          ) : (
            <div className="ft-row-sub" style={{ textAlign: "center", marginTop: 10 }}>Calendrier terminé.</div>
          )}

          <div className="ft-section-label"><span>Journal du mercato</span></div>
          <div className="ft-news">
            {transferLog.length === 0 && <div className="ft-row-sub">Aucun mouvement enregistré pour l'instant.</div>}
            {transferLog.map((n, i) => <div key={i} className="ft-news-item">{n}</div>)}
          </div>
        </>)}

        <div className="ft-footnote">
          <Icon>ℹ️</Icon> Valeurs et salaires estimés (âge/poste) — pas des données officielles.
          {view === "squad" && <span className="ft-reset-link" style={{ marginLeft: "auto" }} onClick={refreshLive}>actualiser</span>}
          {view === "squad" && <span className="ft-reset-link" onClick={saveGame}>💾 sauvegarder</span>}
          {view === "squad" && <span className="ft-reset-link" onClick={restartGame}>recommencer</span>}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<FaisTonMercato />);
</script>
